<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Agent</title>
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181A'/%3E%3Cpath d='M9 21.5 16 9l7 12.5M11.6 17h8.8' fill='none' stroke='%23FFFFFF' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="no-token" class="no-token" hidden>
  <p>请用启动时打印的地址打开。</p>
  <p class="muted">那个地址以 <span class="mono">http://127.0.0.1:</span> 开头，末尾带有 <span class="mono">?t=</span> 和一串字符。</p>
</div>

<div id="boot" class="boot">正在连接…</div>

<div id="app" class="app" hidden>

  <aside id="sidebar" class="sidebar" aria-label="导航">
    <div id="mode-switch" class="mode-switch" role="tablist" aria-label="工作模式" hidden></div>
    <div class="side-top">
      <button id="new-task" class="new-task" type="button" title="开一个新对话">
        <span class="nt-icon" data-icon="plus"></span>
        <span class="nt-text">新对话</span>
      </button>
      <button id="side-collapse" class="side-collapse" type="button" aria-label="收起侧栏" title="收起侧栏" data-icon="sidebar"></button>
    </div>

    <div class="task-search" role="search">
      <span class="search-icon" data-icon="search"></span>
      <input id="task-search" type="search" placeholder="搜以前的对话" aria-label="搜以前的对话：按说过的话查找" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="list-head">
      <span id="list-caption" class="list-caption">对话</span>
      <button id="list-all" class="list-all" type="button" hidden>全部对话</button>
    </div>
    <nav id="task-list" class="task-list" aria-label="对话列表"></nav>

    <section class="folders" aria-labelledby="folders-caption">
      <div id="folders-caption" class="list-caption">文件夹</div>
      <div id="folder-list" class="folder-list"></div>
    </section>

    <nav id="nav" class="nav" aria-label="其他页面">
      <button type="button" class="nav-btn" data-view="kb" data-icon="book" title="资料"><span class="nav-text">资料</span></button>
      <button type="button" class="nav-btn" data-view="memory" data-icon="memory" title="记忆"><span class="nav-text">记忆</span></button>
      <button type="button" class="nav-btn" data-view="schedule" data-icon="clock" title="定时"><span class="nav-text">定时</span></button>
      <button type="button" class="nav-btn" data-view="skills" data-icon="skill" title="技能"><span class="nav-text">技能</span></button>
      <button type="button" class="nav-btn" data-view="settings" data-icon="settings" title="设置"><span class="nav-text">设置</span></button>
      <button id="open-palette" class="nav-btn palette-hint" type="button" data-icon="command" title="查找和跳转">
        <span class="nav-text">查找和跳转</span><kbd id="palette-kbd">Ctrl K</kbd>
      </button>
    </nav>
  </aside>

  <main id="main" class="main">
    <div class="mobilebar">
      <button id="btn-left-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-label="打开侧栏" title="对话列表" data-icon="menu"></button>
      <span id="mobile-title" class="mobile-title"></span>
    </div>

    <section id="view-onboard" class="view view-onboard" hidden>
      <div class="onboard">
        <h1>先选一个文件夹</h1>
        <p class="lede">Agent 只会读写这个文件夹里的文件。之后可以再加别的文件夹。</p>
        <form id="onboard-form" class="form" autocomplete="off">
          <label class="field">
            <span class="field-label">叫什么</span>
            <input id="onboard-name" type="text" placeholder="例如：季度经营分析" required maxlength="60">
          </label>
          <label class="field">
            <span class="field-label">文件夹路径</span>
            <input id="onboard-path" class="mono" type="text" placeholder="例如：/Users/zhang/Documents/经营分析 或 D:\工作\经营分析" required>
            <span class="field-help">在访达或资源管理器里右键文件夹，复制它的路径，粘贴到这里。</span>
          </label>
          <p id="onboard-error" class="form-error" role="alert" hidden></p>
          <div class="form-actions"><button id="onboard-submit" class="btn btn-primary" type="submit">添加文件夹</button></div>
        </form>
      </div>
    </section>

    <section id="view-home" class="view view-home" hidden>
      <div class="home">
        <h1 id="home-greet" class="home-title">你好</h1>
        <p id="home-sub" class="home-sub">想做什么？</p>
        <div class="composer composer-lg" id="home-composer">
          <div id="home-tplform" class="tpl-form" hidden></div>
          <div id="home-folder" class="folder-tag" hidden></div>
          <div id="home-scope" class="scope-chips" role="group" aria-label="只查这些" hidden></div>
          <div id="home-files" class="att-list" hidden></div>
          <div id="home-images" class="thumbs" hidden></div>
          <textarea id="home-input" rows="3" aria-label="输入你的问题或要做的事" placeholder="问点什么，或者说一件要做的事。输入 / 看指令"></textarea>
          <div class="composer-bar">
            <button id="home-plus" class="plus-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="添加文件、图片或文件夹" title="添加文件、图片或文件夹">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          <button id="home-mic" class="voice-btn" type="button" aria-label="语音输入" aria-pressed="false" title="语音输入">
            <svg class="ic-mic" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="5.5" y="1.75" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.25 7.5a4.75 4.75 0 0 0 9.5 0M8 12.25v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <svg class="ic-stop" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
          </button>
          <span id="home-voice" class="voice-status" hidden><span class="voice-time mono"></span><span class="voice-meter" aria-hidden="true"><span class="voice-meter-fill"></span></span><span class="voice-msg"></span></span>
            <button id="home-deep" class="deep-btn" type="button" aria-pressed="false" hidden>深入研究</button>
            <button id="home-mode" class="mode-btn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
            <button id="home-send" class="send-btn" type="button" aria-label="发送" title="发送（回车）。Shift + 回车换行">
              <svg class="ic-send" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13V3.5M3.75 7.5L8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="ic-stop" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1.5" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div id="home-kb" class="home-kb" hidden></div>
        <div class="templates" id="templates">
          <div id="tpl-suggest" class="tpl-suggest" role="group" aria-label="可以试试"></div>
          <div id="tpl-full" class="tpl-full" hidden>
            <div id="tpl-roles" class="tpl-roles" role="tablist" aria-label="岗位"></div>
            <div id="tpl-list" class="tpl-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-task" class="view view-task" hidden>
      <header class="task-head">
        <div class="task-head-main">
          <h1 id="task-title" class="task-title"></h1>
          <span id="task-status" class="status"></span>
          <button id="btn-more" class="btn btn-ghost btn-icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作" title="更多操作">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="task-actions">
          <button id="btn-web-toggle" class="btn btn-ghost btn-sm wp-toggle" type="button" aria-controls="webpane" aria-expanded="false" hidden>网页</button>
          <button id="btn-right-toggle" class="btn btn-ghost btn-sm rp-toggle" type="button" aria-controls="rightpane" aria-expanded="false" hidden>计划与成品</button>
        </div>
      </header>
      <div id="task-banner" class="banner" role="status" hidden></div>
      <div id="timeline-wrap" class="timeline-wrap">
        <div id="timeline" class="timeline" role="log" aria-label="对话内容"></div>
      </div>
      <button id="jump-attention" class="jump" type="button" hidden></button>
      <div class="composer composer-dock" id="task-composer">
        <div id="composer-tplform" class="tpl-form" hidden></div>
        <div id="composer-folder" class="folder-tag" hidden></div>
        <div id="composer-scope" class="scope-chips" role="group" aria-label="只查这些" hidden></div>
        <div id="composer-files" class="att-list" hidden></div>
        <div id="composer-images" class="thumbs" hidden></div>
        <textarea id="composer-input" rows="1" aria-label="给 Agent 发消息"></textarea>
        <div class="composer-bar">
          <button id="composer-plus" class="plus-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="添加文件、图片或文件夹" title="添加文件、图片或文件夹">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        <button id="composer-mic" class="voice-btn" type="button" aria-label="语音输入" aria-pressed="false" title="语音输入">
          <svg class="ic-mic" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="5.5" y="1.75" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.25 7.5a4.75 4.75 0 0 0 9.5 0M8 12.25v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <svg class="ic-stop" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
        </button>
        <span id="composer-voice" class="voice-status" hidden><span class="voice-time mono"></span><span class="voice-meter" aria-hidden="true"><span class="voice-meter-fill"></span></span><span class="voice-msg"></span></span>
          <button id="composer-deep" class="deep-btn" type="button" aria-pressed="false" hidden>深入研究</button>
          <button id="composer-mode" class="mode-btn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
          <button id="composer-send" class="send-btn" type="button" aria-label="发送" title="发送（回车）。Shift + 回车换行">
            <svg class="ic-send" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13V3.5M3.75 7.5L8 3.25l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="ic-stop" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section id="view-page" class="view view-page" hidden>
      <header class="page-head"><h1 id="page-title" class="page-title"></h1><p id="page-sub" class="page-sub"></p></header>
      <div id="page-body" class="page-body"></div>
    </section>
  </main>

  <aside id="rightpane" class="rightpane" aria-label="计划与成品">
    <div id="rp-lists" class="rp-lists">
      <section id="rp-sources-sec" class="rp-sec rp-sources-sec" hidden>
        <h2 class="rp-h">来源</h2>
        <div id="rp-sources" class="rp-sources"></div>
      </section>
      <section id="rp-todo-sec" class="rp-sec">
        <h2 class="rp-h">计划</h2>
        <div id="rp-todo" class="rp-todo"></div>
      </section>
      <section id="rp-art-sec" class="rp-sec">
        <h2 class="rp-h">成品</h2>
        <div id="rp-artifacts" class="rp-artifacts"></div>
      </section>
      <details id="rp-details-wrap" class="rp-sec rp-details" open>
        <summary class="rp-h">详情</summary>
        <div id="rp-details"></div>
      </details>
    </div>
    <div id="rp-preview" class="rp-preview" hidden></div>
  </aside>

  <aside id="webpane" class="webpane" aria-label="网页">
    <header class="wp-head">
      <button id="wp-back" class="btn btn-ghost btn-icon wp-nav" type="button" aria-label="后退" title="后退"></button>
      <button id="wp-fwd" class="btn btn-ghost btn-icon wp-nav" type="button" aria-label="前进" title="前进"></button>
      <button id="wp-reload" class="btn btn-ghost btn-icon wp-nav" type="button" aria-label="刷新" title="刷新"></button>
      <form id="wp-addr-form" class="wp-addr" autocomplete="off">
        <input id="wp-addr" type="text" spellcheck="false" autocomplete="off" aria-label="网址或要搜的词" placeholder="输入网址，或要搜的词">
      </form>
      <button id="wp-close" class="btn btn-ghost btn-icon" type="button" aria-label="关闭网页面板" title="关闭网页面板"></button>
    </header>
    <div id="wp-stage" class="wp-stage">
      <div id="wp-screen" class="wp-screen" hidden>
        <img id="wp-img" class="wp-img" alt="" draggable="false">
        <textarea id="wp-keys" class="wp-keys" aria-label="往网页里输入文字" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>
      <div id="wp-empty" class="wp-empty"></div>
      <div id="wp-dialog" class="wp-dialog" role="alertdialog" aria-modal="false" hidden></div>
    </div>
    <p id="wp-foot" class="wp-foot" role="status"></p>
  </aside>
</div>

<div id="scrim" class="scrim" hidden></div>

<div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="查找和跳转" hidden>
  <input id="palette-input" class="palette-input" type="text" placeholder="搜对话、切换文件夹、打开页面…" autocomplete="off" aria-controls="palette-list">
  <div id="palette-list" class="palette-list" role="listbox"></div>
  <div class="palette-foot">上下键选择，回车打开，Esc 关闭</div>
</div>

<div id="mode-menu" class="menu mode-menu" role="menu" hidden></div>
<div id="scope-menu" class="menu pop-menu scope-menu" role="menu" aria-label="查哪些资料库" hidden></div>
<div id="cite-tip" class="cite-tip" role="tooltip" hidden></div>
<div id="plus-menu" class="menu pop-menu" role="menu" aria-label="添加" hidden></div>
<div id="folder-menu" class="menu pop-menu" role="menu" aria-label="文件夹操作" hidden></div>
<div id="task-menu" class="menu pop-menu" role="menu" aria-label="更多操作" hidden></div>
<div id="slash-menu" class="slash-menu" role="listbox" aria-label="指令" hidden></div>
<div id="slash-card" class="slash-card" role="dialog" aria-label="指令结果" hidden></div>
<div id="hash-menu" class="slash-menu hash-menu" role="listbox" aria-label="选文件" hidden></div>
<div id="doc-pop" class="menu pop-menu doc-pop" role="menu" aria-label="指定文件" hidden></div>
<div id="card-scrim" class="card-scrim" hidden></div>
<aside id="doc-card" class="doc-card" role="dialog" aria-modal="true" aria-label="文档卡片" hidden></aside>

<div id="folder-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="folder-dialog-title" hidden>
  <h2 id="folder-dialog-title" class="dialog-title">用一个文件夹工作</h2>
  <p class="dialog-sub">Agent 只会读写这个文件夹里的文件。</p>
  <form id="folder-form" class="form" autocomplete="off">
    <label class="field">
      <span class="field-label">叫什么</span>
      <input id="folder-name" type="text" placeholder="不填就用文件夹的名字" maxlength="60">
    </label>
    <label class="field">
      <span class="field-label">文件夹路径</span>
      <input id="folder-path" class="mono" type="text" placeholder="例如：/Users/zhang/Documents/经营分析 或 D:\工作\经营分析" required>
      <span class="field-help">在访达或资源管理器里右键文件夹，复制它的路径，粘贴到这里。</span>
    </label>
    <p id="folder-error" class="form-error" role="alert" hidden></p>
    <div class="form-actions">
      <button id="folder-submit" class="btn btn-primary" type="submit">连接这个文件夹</button>
      <button id="folder-cancel" class="btn btn-ghost" type="button">算了</button>
    </div>
  </form>
</div>

<div id="drop-overlay" class="drop-overlay" aria-hidden="true" hidden><div class="drop-box">松手添加文件</div></div>
<div id="toasts" class="toasts" aria-live="assertive"></div>
<input id="file-input" type="file" accept="image/*" multiple hidden>
<input id="file-any" type="file" multiple hidden>

<script src="/app.js"></script>
</body>
</html>
